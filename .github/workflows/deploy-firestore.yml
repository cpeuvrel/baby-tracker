name: Deploy Firestore rules and indexes

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firestore
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      # Never deploy rules that fail their tests (Java is preinstalled on ubuntu-latest).
      - run: npm run test:rules
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # No --force: an index that exists in the console but not in
      # firestore.indexes.json is reported, never deleted.
      - run: functions/node_modules/.bin/firebase deploy --only firestore --non-interactive
