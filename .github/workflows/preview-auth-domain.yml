name: Authorize preview for Google sign-in

# Vercel reports each deployment to GitHub; once a preview is up, add its host
# to Firebase Auth's authorized domains so Google sign-in works there.
on: deployment_status

permissions:
  contents: read

concurrency:
  group: preview-auth-domain
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'Preview') &&
      startsWith(github.event.deployment_status.environment_url, 'https://baby-tracker-')
    runs-on: ubuntu-latest
    steps:
      # The script runs with the service account: always take it from the
      # default branch, never from the branch that was deployed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: ACCESS_TOKEN="$(gcloud auth print-access-token)" node scripts/authorize-preview-domain.mjs
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          PROJECT_ID: baby-tracker-c8fd2
