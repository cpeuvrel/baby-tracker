name: Authorize preview for Google sign-in

# Vercel reports each deployment to GitHub; once a preview is up, add its host
# to Firebase Auth's authorized domains so Google sign-in works there.
on: deployment_status

permissions:
  contents: read

concurrency:
  group: preview-auth-domain
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: ACCESS_TOKEN="$(gcloud auth print-access-token)" node scripts/authorize-preview-domain.mjs
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          PROJECT_ID: baby-tracker-c8fd2
